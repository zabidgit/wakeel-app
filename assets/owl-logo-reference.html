<!DOCTYPE html>
<html><body style="background:#111;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex-direction:column;">

<!-- Logo 2: The Owl -->
<div style="text-align:center;">
<svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4a56e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Owl body -->
  <ellipse cx="100" cy="130" rx="60" ry="70" fill="none" stroke="url(#owlGrad)" stroke-width="3"/>
  <!-- Head -->
  <circle cx="100" cy="70" r="45" fill="none" stroke="url(#owlGrad)" stroke-width="3"/>
  <!-- Left ear tuft -->
  <path d="M65 35 L55 10 L75 30" fill="url(#owlGrad)" stroke="none"/>
  <!-- Right ear tuft -->
  <path d="M135 35 L145 10 L125 30" fill="url(#owlGrad)" stroke="none"/>
  <!-- Left eye -->
  <circle cx="80" cy="68" r="15" fill="none" stroke="#d4a853" stroke-width="2.5"/>
  <circle cx="80" cy="68" r="6" fill="#d4a853"/>
  <!-- Right eye -->
  <circle cx="120" cy="68" r="15" fill="none" stroke="#d4a853" stroke-width="2.5"/>
  <circle cx="120" cy="68" r="6" fill="#d4a853"/>
  <!-- Beak -->
  <path d="M95 82 L100 92 L105 82" fill="#d4a853" stroke="none"/>
  <!-- Wing lines -->
  <path d="M55 120 Q70 140 60 170" fill="none" stroke="url(#owlGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M145 120 Q130 140 140 170" fill="none" stroke="url(#owlGrad)" stroke-width="2" opacity="0.6"/>
</svg>
<div style="font-family:'Georgia',serif;color:#d4a853;font-size:36px;letter-spacing:6px;margin-top:15px;">WAKEEL</div>
<div style="font-family:Arial,sans-serif;color:#666;font-size:11px;letter-spacing:5px;margin-top:5px;">NEVER SLEEPS • NEVER FORGETS</div>
</div>

</body></html>
